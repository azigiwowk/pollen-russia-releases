name: Publish exact main APK

on:
  workflow_dispatch:
  push:
    paths:
      - publish-request.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: azigiwowk/pollen-russia-app
      RELEASE_REPO: azigiwowk/pollen-russia-releases
      SOURCE_WORKFLOW: android-debug.yml

    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Verify source token
        run: |
          if [ -z "${{ secrets.SOURCE_REPO_PAT }}" ]; then
            echo "Missing SOURCE_REPO_PAT repository secret"
            exit 1
          fi

      - name: Resolve exact source commit
        env:
          GH_TOKEN_SOURCE: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          COMMIT_JSON="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN_SOURCE"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOURCE_REPO/commits/main")"
          SOURCE_SHA="$(echo "$COMMIT_JSON" | jq -r '.sha')"
          if [ -z "$SOURCE_SHA" ] || [ "$SOURCE_SHA" = "null" ]; then
            echo "Could not resolve main SHA"
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Publishing source commit $SOURCE_SHA"

      - name: Find successful build for exact commit
        env:
          GH_TOKEN_SOURCE: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          RUNS="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN_SOURCE"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOURCE_REPO/actions/workflows/$SOURCE_WORKFLOW/runs?branch=main&status=success&per_page=30")"

          RUN_ID="$(echo "$RUNS" | jq -r --arg sha "$SOURCE_SHA"             '.workflow_runs | map(select(.head_sha == $sha and .conclusion == "success")) | .[0].id // empty')"

          if [ -z "$RUN_ID" ]; then
            echo "No successful Android build found for exact commit $SOURCE_SHA"
            exit 1
          fi

          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Find APK artifact from exact run
        env:
          GH_TOKEN_SOURCE: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          DATA="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN_SOURCE"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=20")"

          ARTIFACT_ID="$(echo "$DATA" | jq -r             '.artifacts | map(select(.name == "pollen-moscow-debug-apk" and .expired == false)) | .[0].id // empty')"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "APK artifact not found for run $SOURCE_RUN_ID"
            exit 1
          fi

          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"

      - name: Download and unpack exact APK
        env:
          GH_TOKEN_SOURCE: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pollen-artifact /tmp/pollen-artifact.zip
          mkdir -p /tmp/pollen-artifact

          curl -fsSL -L             -H "Authorization: Bearer $GH_TOKEN_SOURCE"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID/zip"             -o /tmp/pollen-artifact.zip

          unzip -o /tmp/pollen-artifact.zip -d /tmp/pollen-artifact
          APK="$(find /tmp/pollen-artifact -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found inside artifact"
            exit 1
          fi

          cp "$APK" pollen-russia.apk

      - name: Read version from same source commit
        env:
          GH_TOKEN_SOURCE: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          CONTENT_JSON="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN_SOURCE"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOURCE_REPO/contents/app/build.gradle.kts?ref=$SOURCE_SHA")"

          echo "$CONTENT_JSON" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/app-build.gradle.kts

          VERSION_CODE="$(grep -Eo 'versionCode = [0-9]+' /tmp/app-build.gradle.kts | head -n1 | awk '{print $3}')"
          VERSION_NAME="$(grep -Eo 'versionName = "[^"]+"' /tmp/app-build.gradle.kts | head -n1 | cut -d'"' -f2)"

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Could not parse app version"
            exit 1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build public update manifest
        run: |
          set -euo pipefail
          SHA256="$(sha256sum pollen-russia.apk | awk '{print $1}')"
          APK_URL="https://raw.githubusercontent.com/$RELEASE_REPO/main/pollen-russia.apk"

          jq -n             --argjson versionCode "$VERSION_CODE"             --arg versionName "$VERSION_NAME"             --arg apkUrl "$APK_URL"             --arg sha256 "$SHA256"             --arg sourceSha "$SOURCE_SHA"             '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              sourceSha: $sourceSha,
              notes: [
                ("Тестовая версия " + $versionName),
                "APK и номер версии проверены по одному финальному коммиту"
              ]
            }' > version.json

      - name: Publish APK and manifest
        run: |
          set -euo pipefail
          git config user.name "Pollen Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pollen-russia.apk version.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Publish alpha $VERSION_NAME from $SOURCE_SHA"
          git push
